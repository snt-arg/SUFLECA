run:
  # ensure this is the same as the name of checkpoint folder
  # ensure this is the same as the one used for render_pool generation
  checkpoint: sufleca

image_processing:
  image_size: 448
  max_depth: 5.0
  iqr_limit: 1.5

ransac:
  inlier_threshold: 0.08
  pct_multiplier: 0.30
  max_iterations: 300000

correspondence:
  mknn:
    n_points: 1024
    max_correspondences: 256
    k: 12
  geo_filter:
    beta: 0.25        # consensus band; 0 disables the filter
    rel_thresh: 0.40  # min agreement with the consensus clique
