run:
  # ensure this is the same as the name of checkpoint folder
  # ensure this is the same as the one used for render_pool generation
  checkpoint: sufleca

image_processing:
  image_size: 448
  max_depth: 5.0
  iqr_limit: 1.5

ransac:
  inlier_threshold: 0.11
  pct_multiplier: 0.30
  max_iterations: 300000

correspondence:
  mknn:
    n_points: 1024
    max_correspondences: 256
    k: 13
  geo_filter:
    beta: 0.01
    aniso_shrink: 0.5
    rel_thresh: 0.05
